/* Entrance, gallery wayfinding, and exhibit reading layout. */
[hidden] { display: none !important; }
main:focus { outline: none; }
.hero {
  min-height: min(820px, 96svh);
  background: #191323;
}
.hero-bg { filter: saturate(.78) brightness(.82); }
.hero::before {
  background: linear-gradient(90deg, #0a0a16f5, #131020cb 36%, #15102035 80%),
    linear-gradient(0deg, var(--bg), transparent 26%, transparent 77%, #090a17a6);
}
.hero-shell { width: 100%; }
.hero-content { max-width: 700px; }
.hero h1 {
  max-width: 9ch;
  margin: 0 0 25px;
  font-size: clamp(4.7rem, 11vw, 9rem);
  text-wrap: initial;
}
.hero h1 em { display: block; }
.hero-lede { max-width: 410px; margin: 0 0 30px; }
.gallery-listing h1 { font-size: clamp(3.2rem, 6vw, 5.4rem); margin: 0; }
.gallery-listing .gallery-caption { margin: 0; font-size: .95rem; }
.gallery-card:is(:hover, :focus-visible) { border-color: var(--gallery-accent); }
.gallery-card:is(:hover, :focus-visible)::before { transform: scale(1.06); filter: saturate(1); }
.gallery-index { color: var(--gallery-accent); flex-shrink: 0; }
.gallery-nav { border-bottom: 1px solid var(--line); background: #101321; }
.gallery-nav-inner { display: flex; flex-wrap: wrap; gap: 4px 20px; padding-block: 10px; }
.gallery-nav a { padding: 10px 2px 8px; border-bottom: 2px solid transparent; color: var(--muted); }
.gallery-nav a:is(:hover, [aria-current]) { border-bottom-color: var(--gold); color: var(--cream); }
.artists-section { padding-top: 65px; }
.artist-title, .gallery-hero h1 { overflow-wrap: anywhere; }
.artist-name-tag { color: var(--gallery-accent, var(--gold)); }
.artist-description, .work-desc { font-size: 1rem; }
.work-source { font-size: .875rem; }
.work-art .item-type, .portrait-label { font-size: .75rem; }
.work-art:not(.has-image):not(:has(iframe)) { min-height: 165px; aspect-ratio: 2 / 1; }

const ARTISTS = [

  {...A('leontyne-price','Leontyne Price','1927–','American operatic soprano','Leontyne Price became one of the first Black opera singers to achieve international superstar status. Known for her rich, luminous soprano voice, she was especially celebrated in the operas of Giuseppe Verdi. Her historic performances at the Metropolitan Opera helped reshape expectations about who could command the world’s greatest stages.','Leontyne_Price',[

  {...A('zubin-mehta','Zubin Mehta','1936–','Indian orchestral conductor','Born in Mumbai, Zubin Mehta built an international conducting career with major orchestras including the Los Angeles Philharmonic, New York Philharmonic, and Israel Philharmonic. His performances are known for expansive orchestral sound and interpretations of symphonic and operatic classics. His career also illustrates how musical leadership crosses national and cultural boundaries.','Zubin_Mehta',[

  {...A('ray-charles','Ray Charles','1930–2004','American singer, pianist & composer','Ray Charles blended gospel, blues, jazz, and rhythm and blues into a sound that helped define soul music. His performances made emotion audible through his voice and piano playing. He also crossed genre boundaries with influential country and pop recordings.','Ray_Charles',[

  {...A('bessie-smith','Bessie Smith','1894–1937','American blues singer','Often called the Empress of the Blues, Bessie Smith was one of the most popular and influential singers of the 1920s. Her commanding voice and emotionally direct performances conveyed loss, independence, humor, and resilience. She influenced later generations of jazz, blues, and popular singers.','Bessie_Smith',[

  {...A('frederic-chopin','Frédéric Chopin','1810–1849','Polish composer & pianist','Frédéric Chopin transformed the expressive possibilities of piano music during the Romantic era. His nocturnes, études, preludes, and larger piano works mix technical invention with intimate lyricism. Much of his music reflects both his Polish heritage and his life in Paris.','Fr%C3%A9d%C3%A9ric_Chopin',[

  {...A('kathleen-battle','Kathleen Battle','1948–','American operatic soprano','Kathleen Battle is known for her clear soprano voice, elegant phrasing, and interpretations of opera, art song, and spirituals. Her career spans leading opera houses and recital stages. She has also brought spirituals and concert music to wider audiences through recordings.','Kathleen_Battle',[

  {...A('tennessee-williams','Tennessee Williams','1911–1983','American playwright','Tennessee Williams wrote psychologically intense plays about longing, loneliness, memory, and fragile hopes. His poetic dialogue and complicated characters changed twentieth-century American drama. His best-known works continue to be staged across the world.','Tennessee_Williams',[

  {...A('anton-chekhov','Anton Chekhov','1860–1904','Russian playwright & short-story writer','Anton Chekhov pioneered a subtle dramatic style in which ordinary conversations reveal unspoken emotions and frustrated hopes. His plays avoid simple heroes and villains, finding meaning in the pauses and tensions of everyday life. His writing strongly influenced modern realistic theater.','Anton_Chekhov',[

  {...A('william-shakespeare','William Shakespeare','1564–1616','English playwright & poet','William Shakespeare created plays and poetry that profoundly shaped English literature and the theater. His tragedies, comedies, and histories explore love, power, identity, and human contradiction. His characters and phrases remain part of artistic life centuries later.','William_Shakespeare',[

  // WORDS
  {...A('fyodor-dostoyevsky','Fyodor Dostoyevsky','1821–1881','Russian novelist','Fyodor Dostoyevsky explored guilt, morality, faith, freedom, and the darkest corners of the human mind. His novels immerse readers in characters wrestling with ethical and psychological crises. His work influenced both modern fiction and philosophy.','Fyodor_Dostoevsky',[

  {...A('voltaire','Voltaire','1694–1778','French writer & philosopher','Voltaire was a central voice of the European Enlightenment. Through satire, essays, and fiction, he challenged intolerance, abuses of power, and unquestioned authority. His wit helped make philosophical debate accessible to a wide reading public.','Voltaire',[

  {...A('gwendolyn-brooks','Gwendolyn Brooks','1917–2000','American poet','Gwendolyn Brooks wrote precise, musical poetry about everyday Black life, especially in Chicago. In 1950 she became the first Black writer to win a Pulitzer Prize, awarded in Poetry for Annie Allen. Her compact lines can hold both intimate observation and powerful social criticism.','Gwendolyn_Brooks',[

  {...A('robert-frost','Robert Frost','1874–1963','American poet','Robert Frost used conversational language and rural New England settings to explore difficult choices and human relationships. His familiar imagery often conceals uncertainty and philosophical complexity. He became one of the most widely read American poets of the twentieth century.','Robert_Frost',[
    W('Mending Wall','1914','A poem about boundaries, tradition, and the meaning of neighborliness.'),W('The Road Not Taken','1915','A reflection on choice and how people construct stories about their past.'),W('Stopping by Woods on a Snowy Evening','1923','A lyrical meditation on beauty, stillness, and obligation.')]),gallery:'words'},
  {...A('langston-hughes','Langston Hughes','1901 or 1902–1967','American poet, novelist & playwright','Langston Hughes was a leading writer of the Harlem Renaissance. His poetry drew on jazz, blues, everyday speech, and the lives of Black Americans. He used accessible language to capture both joy and the struggle for dignity.','Langston_Hughes',[
    W('The Weary Blues','1926','A collection that brings the sounds and rhythms of blues into poetry.'),W('Montage of a Dream Deferred','1951','A book-length sequence of poems portraying Harlem through jazz-like rhythms.'),W('Harlem (“Dream Deferred”)','1951','A short poem asking what happens when aspirations are continually postponed.')]),gallery:'words'},
  {...A('toni-morrison','Toni Morrison','1931–2019','American novelist & essayist','Toni Morrison wrote richly layered novels exploring memory, race, family, and the lasting effects of history. She received the Nobel Prize in Literature in 1993. Her work transformed the possibilities of American fiction through powerful language and storytelling.','Toni_Morrison',[
    W('The Bluest Eye','1970','A debut novel about beauty standards, trauma, and a young girl’s sense of self.'),W('Song of Solomon','1977','A novel about family roots, identity, and the search for freedom.'),W('Beloved','1987','A haunting novel confronting the legacy of slavery and remembrance.')]),gallery:'words'},
  {...A('james-baldwin','James Baldwin','1924–1987','American writer & essayist','James Baldwin used fiction and essays to examine race, sexuality, belonging, religion, and American democracy. His voice combined moral urgency with emotional precision. His writing continues to shape discussions of identity and social justice.','James_Baldwin',[
    W('Go Tell It on the Mountain','1953','A semi-autobiographical novel about religion, family, and growing up in Harlem.'),W('Notes of a Native Son','1955','Essays on race, family, literature, and American life.'),W('The Fire Next Time','1963','Two essays on racial injustice, faith, and the future of the United States.')]),gallery:'words'},
  {...A('alice-walker','Alice Walker','1944–','American novelist, poet & activist','Alice Walker’s writing examines Black women’s lives, creativity, resilience, and the struggle for self-determination. Her novel The Color Purple received the Pulitzer Prize for Fiction. She has also written influential essays about recovering overlooked artistic histories.','Alice_Walker',[
    W('Meridian','1976','A novel about a young woman navigating the civil rights movement.'),W('The Color Purple','1982','An epistolary novel about suffering, friendship, love, and self-discovery.'),W('In Search of Our Mothers’ Gardens','1983','Essays about creativity, heritage, feminism, and Black women’s art.')]),gallery:'words'},
  {...A('zora-neale-hurston','Zora Neale Hurston','1891–1960','American novelist & anthropologist','Zora Neale Hurston was a key Harlem Renaissance writer whose fiction celebrates Black Southern speech, humor, and cultural life. Her work as an anthropologist helped preserve folklore and oral traditions. Her novels feature memorable women seeking independence and their own voices.','Zora_Neale_Hurston',[
    W('Jonah’s Gourd Vine','1934','A novel about faith, relationships, and rural Southern Black life.'),W('Mules and Men','1935','A collection of African American folklore based on Hurston’s fieldwork.'),W('Their Eyes Were Watching God','1937','A novel of love, self-discovery, voice, and independence.')]),gallery:'words'},
  // VISUAL
  {...A('toulouse-lautrec','Henri de Toulouse-Lautrec','1864–1901','French painter & printmaker','Henri de Toulouse-Lautrec captured the nightlife and performers of late nineteenth-century Paris. His posters used bold silhouettes, unusual cropping, and striking flat color. He helped elevate commercial lithography into an influential form of modern art.','Henri_de_Toulouse-Lautrec',[
    W('Moulin Rouge: La Goulue','1891','A pioneering lithographic poster advertising a famous Parisian cabaret performer.','art','Moulin_Rouge:_La_Goulue'),W('At the Moulin Rouge','1892–1895','A painting of the cabaret’s world and its vivid social atmosphere.','art','At_the_Moulin_Rouge'),W('Jane Avril','1893','A celebrated poster featuring the dancer in an elegant, graphic composition.','art','Jane_Avril_(poster)')]),gallery:'visual'},
  {...A('jacob-lawrence','Jacob Lawrence','1917–2000','American painter','Jacob Lawrence is celebrated for narrative painting that tells stories from African American history. He used bold shapes, repeated colors, and compressed space to create visual sequences. The Migration Series remains one of the most important examples of American history represented through modern art.','Jacob_Lawrence',[
    W('The Migration Series','1940–1941','A sixty-panel narrative about the Great Migration from the American South.','art','The_Migration_Series'),W('The Life of Toussaint L’Ouverture','1938','A series recounting the Haitian revolutionary leader’s life.','art','The_Life_of_Toussaint_L%27Ouverture'),W('The Builders','1947','A painting that reflects Lawrence’s interest in work, community, and structure.','art','Jacob_Lawrence')]),gallery:'visual'},
  {...A('aaron-douglas','Aaron Douglas','1899–1979','American painter & muralist','Aaron Douglas developed a distinctive visual language of silhouettes, layered geometric forms, and radiating circles. His murals brought African American history and spiritual life into striking modern compositions. He is widely associated with the visual art of the Harlem Renaissance.','Aaron_Douglas_(artist)',[

  {...A('paul-cezanne','Paul Cézanne','1839–1906','French post-Impressionist painter','Paul Cézanne studied how color, structure, and viewpoint could shape the experience of looking. His landscapes and still lifes helped bridge Impressionism and modern art. Later artists, including Picasso, drew inspiration from his experiments with form.','Paul_C%C3%A9zanne',[

  {...A('pablo-picasso','Pablo Picasso','1881–1973','Spanish painter & sculptor','Pablo Picasso was a major figure in twentieth-century art and co-developed Cubism. He questioned fixed perspective and experimented across painting, drawing, sculpture, and printmaking. His work spans intimate portraits and monumental responses to political violence.','Pablo_Picasso',[
    W('Les Demoiselles d’Avignon','1907','A revolutionary painting that fractured traditional space and representation.','art','Les_Demoiselles_d%27Avignon'),W('Guernica','1937','A monumental antiwar painting responding to the bombing of a Basque town.','art','Guernica_(Picasso)'),W('The Weeping Woman','1937','A powerful image of grief using angular forms and emotional color.','art','The_Weeping_Woman')]),gallery:'visual'},
  {...A('georgia-okeeffe','Georgia O’Keeffe','1887–1986','American modernist painter','Georgia O’Keeffe is known for dramatically enlarged flowers, landscapes, and images of the American Southwest. Through scale and simplified form, she made familiar subjects feel mysterious and new. Her work established a distinctive place in American modernism.','Georgia_O%27Keeffe',[
    W('Black Iris III','1926','A close-up flower painting using folds, shadows, and abstraction.','art','Black_Iris_III'),W('Red Canna','1924','A vivid floral painting that magnifies curves and intense color.','art','Red_Canna'),W('Jimson Weed/White Flower No. 1','1932','A monumental white blossom painted at extraordinary scale.','art','Jimson_Weed/White_Flower_No._1')]),gallery:'visual'},

    W('Mona Lisa','c. 1503–1519','A celebrated portrait renowned for its subtle expression and atmospheric depth.','art','Mona_Lisa'),W('The Last Supper','c. 1495–1498','A monumental mural staging an emotionally charged moment among Christ and the apostles.','art','The_Last_Supper_(Leonardo)'),W('Vitruvian Man','c. 1490','A drawing exploring the proportions of the human body through geometry.','art','Vitruvian_Man')]),gallery:'visual'},
  {...A('frida-kahlo','Frida Kahlo','1907–1954','Mexican painter','Frida Kahlo made self-portraiture a powerful language for exploring identity, bodily pain, love, and cultural heritage. Her meticulously symbolic paintings combine intensely personal experiences with vivid imagery. She has become an enduring figure in twentieth-century art.','Frida_Kahlo',[

  {...A('rembrandt','Rembrandt','1606–1669','Dutch painter & printmaker','Rembrandt van Rijn was a master of portraiture, storytelling, and dramatic light. He used shadow and expressive faces to bring psychological depth to historical and everyday scenes. His paintings and etchings remain central to the Dutch Golden Age.','Rembrandt',[

/* The museum is deliberately dependency-free, so it can publish directly to GitHub Pages.
   No synthetic or AI-generated imagery is used. Photos are real Unsplash photographs;
   previews are retrieved live from Wikimedia Commons / Open Library / YouTube. */

const wikiArticle = slug => `https://en.wikipedia.org/wiki/${slug}`;
const wikiSearch = query=>`https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(query)}`;
const bookSearch = (title, author)=>`https://openlibrary.org/search?title=${encodeURIComponent(title)}&author=${encodeURIComponent(author)}`;
const musicSearch=(artist,title)=>`https://www.youtube.com/results?search_query=${encodeURIComponent(`${artist} ${title} recording performance`)}`;
const currentHash =()=> (location.hash || '#/').slice(1).replace(/\/+$/,'') || '/';
const wrapMain = (body, className='') => `${header()}<main id="main" class="${className} page-entrance" tabindex="-1">${body}</main>${footer()}`;

function header(){return `<header class="site-header"><div class="header-inner shell"><a class="brand" href="#/" aria-label="The Living Museum, home"><span class="brand-symbol">✧</span><span>The Living Museum</span></a><nav class="nav-actions" aria-label="Main navigation"><a class="nav-link" href="#/galleries">Explore galleries</a><a class="nav-link" href="#/about">About & credits</a><span class="nav-dot" aria-hidden="true"></span></nav></div></header>`}
function footer(){return `<footer class="site-footer"><div class="shell"><div class="footer-top"><div><div class="footer-brand">The Living Museum</div><p class="footer-desc">Five galleries. Thirty-one creative minds. A digital journey through the people who changed the way we create and experience art.</p></div><nav class="footer-links" aria-label="Footer links"><a href="#/galleries">Galleries</a><a href="#/about">Image credits & sources</a><a href="#/">Return to entrance</a></nav></div><div class="footer-bottom"><span>31 artists</span></div></div></footer>`}
function galleryCard(g) {
  const count = byGallery(g.id).length;
  return `<a class="gallery-card" href="#/gallery/${g.id}" style="--card-photo:url('${g.image}');--gallery-accent:${g.accent}">
    <div class="gallery-top"><span>${esc(g.short)}</span><span class="gallery-index" aria-hidden="true">${g.icon}</span></div>
    <div><h3 class="gallery-name">${esc(g.name)}</h3><p class="gallery-caption">${count} artists</p></div>
  </a>`;
}

function galleryListing(isHome) {
  const heading = isHome ? 'h2' : 'h1';
  return `<section class="section gallery-listing" aria-labelledby="gallery-heading"><div class="shell">
    <div class="section-heading"><${heading} id="gallery-heading" class="serif">Explore the galleries</${heading}></div>
    <div class="gallery-grid">${GALLERIES.map(galleryCard).join('')}</div>
  </div></section>`;
}

function home() {
  return wrapMain(`<section class="hero" style="--bg-photo:url('${PHOTOS.entrance}')">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="float-spark spark-a" aria-hidden="true"></div>
    <div class="float-spark spark-b" aria-hidden="true"></div>
    <div class="float-spark spark-c" aria-hidden="true"></div>
    <div class="shell hero-shell"><div class="hero-content">
      <h1>The Living <em>Museum</em></h1>
      <p class="hero-lede">Explore music, theater, literature, visual arts, and sculpture through the lives and works of 31 artists.</p>
      <a class="button-primary" href="#/galleries">Enter the museum</a>
    </div></div>
  </section><div class="gold-line"></div>${galleryListing(true)}`,'home-main');
}

function lobby() {
  return wrapMain(galleryListing(false),'lobby-main');
}

function galleryNav(activeId) {
  return `<nav class="gallery-nav" aria-label="Museum galleries"><div class="shell gallery-nav-inner">
    ${GALLERIES.map(g => `<a href="#/gallery/${g.id}"${g.id === activeId ? ' aria-current="page"' : ''}>${esc(g.short)}</a>`).join('')}
  </div></nav>`;
}

function artistCard(a){const words=a.name.split(' ');const initial=words.length>1?`${words[0][0]}${words.at(-1)[0]}`:a.name.slice(0,2);return `<a href="#/artist/${a.id}" class="artist-card"><div class="artist-card-portrait"><div class="portrait-placeholder" aria-hidden="true">${esc(initial)}</div><img data-wiki="${esc(a.wikipedia)}" data-kind="portrait" alt="Portrait of ${esc(a.name)}" loading="lazy" hidden /></div><div class="artist-card-body"><h3>${esc(a.name)}</h3><p class="artist-card-role">${esc(a.role)}</p><div class="artist-card-action"><span>View exhibit</span></div></div></a>`}
function galleryPage(id){const g=getGallery(id);if(!g)return missing();const artists=byGallery(id);return wrapMain(`<section class="gallery-hero" style="--bg-photo:url('${g.image}')"><div class="gallery-hero-bg" aria-hidden="true"></div><div class="shell"><div class="breadcrumbs"><a href="#/">Entrance</a><span class="slash">/</span><a href="#/galleries">Galleries</a><span class="slash">/</span><span>${esc(g.name)}</span></div><div class="tiny eyebrow">Gallery ${g.number} &nbsp; · &nbsp; ${artists.length} artists</div><h1>${esc(g.name)}</h1><p class="subtitle">${esc(g.description)}</p></div></section>${galleryNav(g.id)}<section class="section artists-section"><div class="shell"><div class="section-heading"><h2>Artists</h2></div><div class="artist-grid">${artists.map(artistCard).join('')}</div></div></section>`,'gallery-main')}
const catalogSources = {
  "Moulin Rouge: La Goulue": "https://www.metmuseum.org/art/collection/search/333990",
  "Jane Avril": "https://www.metmuseum.org/art/collection/search/333993",
  "The Migration Series": "https://www.moma.org/calendar/exhibitions/444",
  "Aspects of Negro Life": "https://old-digitalcollections.nypl.org/items/6ca557ed-9597-5dcd-e040-e00a18065af4",
  "Song of the Towers": "https://www.si.edu/object/aspects-negro-life-song-towers-painting%3Asiris_ari_399542",
  "The Card Players": "https://www.metmuseum.org/art/collection/search/435868",
  "Mont Sainte-Victoire": "https://www.philamuseum.org/objects/71967",
  "Guernica": "https://www.museoreinasofia.es/en/collections/artwork/guernica-0/",
  "Les Demoiselles d’Avignon": "https://www.moma.org/collection/works/79766",
  "Self-Portrait with Thorn Necklace and Hummingbird": "https://www.hrc.utexas.edu/frida-kahlo-self-portrait/",
  "David": "https://www.galleriaaccademiafirenze.it/en/artworks/david-michelangelo/",
  "Pietà": "https://www.basilicasanpietro.va/en/san-pietro/the-pieta-of-saint-peter-s",
  "Walking Man I": "https://www.fondation-giacometti.com/en/database/174203/walking-man-i",
  "Pointing Man": "https://www.fondation-giacometti.fr/en/database/181776/pointing-man",
  "Black Sun": "https://www.si.edu/object/black-sun-sculpture%3Asiris_ari_15043",
  "Akari Light Sculptures": "https://shop.noguchi.org/collections/akari-light-sculptures",
  "Hamlet": "https://www.folger.edu/explore/shakespeares-works/hamlet/",
  "The Night Watch": "https://www.rijksmuseum.nl/nl/collectie/object/De-Nachtwacht-van-Rembrandt-1642--beb298875917ec40ff09779a547f9442",
  "Polonaise in A-flat Major, Op. 53": "https://chopin.nifc.pl/en/chopin/kompozycja/116_polonaise-in-a-flat-major/",
  'leontyne-price': 'https://library.rcmusic.com/cgi-bin/koha/opac-ISBDdetail.pl?biblionumber=43941',
  'kathleen-battle': 'https://www.deutschegrammophon.com/en/catalogue/products/kathleen-battle-at-carnegie-hall-6627',
  'We Real Cool': 'https://www.poetryfoundation.org/poetrymagazine/poems/28112/we-real-cool',
  'The Life of Toussaint L’Ouverture': 'https://ccaha.org/news/amistad-research-centers-life-toussaint-louverture-jacob-lawrence',
  'The Builders': 'https://www.christies.com/en/lot/lot-4907445',
  'Into Bondage': 'https://www.nga.gov/artworks/166444-bondage',
  'Black Iris III': 'https://www.metmuseum.org/art/collection/search/489813',
  'The Last Supper': 'https://cenacolovinciano.org/en/museum/the-works/the-last-supper-leonardo-da-vinci-1452-1519/',
  'The Anatomy Lesson of Dr. Nicolaes Tulp': 'https://www.mauritshuis.nl/en/our-collection/artworks/146-the-anatomy-lesson-of-dr-nicolaes-tulp',
  'The Palace at 4 a.m.': 'https://www.moma.org/collection/works/80928'
};
function sourceForWork(a,w){
  const catalog = catalogSources[w.title] || catalogSources[a.id];
  if (catalog) return catalog;
  if(w.media==='music')return w.video?`https://www.youtube.com/watch?v=${w.video}`:musicSearch(a.name,w.title);
  if(w.media==='book')return bookSearch(w.title,a.name);
  return w.wiki && w.wiki!==a.wikipedia?wikiArticle(w.wiki):wikiSearch(`${w.title} ${a.name}`);
}
function mediaMarkup(a,w){let kind=w.media==='music'?'recording':w.media==='book'?'book / play':'artwork';
  if(w.media==='music'&&w.video){return `<div class="work-art"><span class="item-type">Video · ${esc(kind)}</span><div class="video-shell"><iframe loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="${esc(w.title)} — performance" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${w.video}"></iframe></div></div>`}
  return `<div class="work-art" data-card-media="${esc(w.media)}"><span class="item-type">${esc(kind)}</span><div class="work-fallback">${w.media==='music'?'<span class="record-fallback">♫</span>':esc(w.title)}</div><img hidden data-kind="work" data-media="${esc(w.media)}" data-wiki="${esc(w.wiki === a.wikipedia ? '' : w.wiki)}" data-work="${esc(w.title)}" data-author="${esc(a.name)}" alt="Source-hosted image for ${esc(w.title)}" loading="lazy"/><button type="button" class="view-zoom" aria-label="Enlarge ${esc(w.title)}" data-zoom="${esc(w.title)}">↗</button></div>`
}
function workCard(a,w){const label=(catalogSources[w.title] || catalogSources[a.id]) ? 'View catalog source' : w.media==='music'?(w.video?'Watch recording':'Find a recording'):w.media==='book'?'Explore an edition':'Explore original / source';return `<article class="work-card">${mediaMarkup(a,w)}<div class="work-body"><h3>${esc(w.title)}</h3><p class="work-date">${esc(w.year)}</p><p class="work-desc">${esc(w.description)}</p><a class="work-source" href="${esc(sourceForWork(a,w))}" target="_blank" rel="noopener noreferrer"><span>${esc(label)}</span><span aria-hidden="true">↗</span></a></div></article>`}
function artistPage(id){const a=getArtist(id);if(!a)return missing();const g=getGallery(a.gallery);const members=byGallery(a.gallery);const position=members.findIndex(item=>item.id===a.id);const prev=members[(position-1+members.length)%members.length];const next=members[(position+1)%members.length];return wrapMain(`<div class="artist-page" style="--gallery-accent:${g.accent}"><div class="shell"><div class="artist-top"><a class="back-link" href="#/gallery/${g.id}"><span aria-hidden="true">←</span> Back to ${esc(g.name)}</a></div><section class="artist-intro"><div class="portrait-art"><div class="portrait-inner"><div class="portrait-placeholder" aria-hidden="true">${esc(a.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><img hidden data-kind="portrait" data-wiki="${esc(a.wikipedia)}" alt="Portrait of ${esc(a.name)}"/><a class="portrait-label" hidden href="${esc(wikiArticle(a.wikipedia))}" target="_blank" rel="noopener noreferrer">Portrait source ↗</a></div></div><div><div class="artist-name-tag">Gallery ${g.number} &nbsp; / &nbsp; ${esc(g.name)}</div><h1 class="artist-title">${esc(a.name)}</h1><p class="artist-dates">${esc(a.years)} &nbsp; · &nbsp; ${esc(a.role)}</p><p class="artist-description">${esc(a.bio)}</p><a class="artist-link" href="${esc(wikiArticle(a.wikipedia))}" target="_blank" rel="noopener noreferrer">Read artist biography <span aria-hidden="true">↗</span></a></div></section></div><section class="works-section"><div class="shell"><div class="works-header"><div><h2>Featured works</h2></div></div><div class="works-grid">${a.works.map(w=>workCard(a,w)).join('')}</div><p class="source-hint">Images and covers, where available, come from <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> or <a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a>. Original recordings are embedded only when verified. Some copyrighted works cannot be reproduced here; use each source link to see the original.</p></div></section><div class="shell"><nav class="artist-pager" aria-label="Browse artist exhibits"><a class="pager-link" href="#/artist/${prev.id}"><small>← Previous artist</small>${esc(prev.name)}</a><a class="pager-link" href="#/artist/${next.id}" style="text-align:right"><small>Next artist →</small>${esc(next.name)}</a></nav></div></div>`,'artist-main')}
function aboutPage(){return wrapMain(`<section class="about-section"><div class="shell"><span class="tiny eyebrow">Behind the collection</span><h1>About this museum.</h1><p>The Living Museum is an educational creative arts project featuring 31 people across five galleries: music, theater, literature, visual arts, and sculpture. Each artist page contains a short background and three selected works. The magic of the site comes from layout, color, lighting, and motion—not generated imagery.</p><p>All gallery photographs are authentic stock photographs. Artist portraits and images are requested from Wikimedia and displayed only if a Commons license can be identified; book-cover previews come from Open Library; a small number of identified performances are embedded from YouTube. We do not claim copyright ownership over artworks, book covers, or recordings. Some works are linked rather than displayed where a suitable reusable preview is unavailable.</p><div class="credit-grid"><section class="credit-panel"><h2>Photography</h2><ul>${PHOTO_CREDITS.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)} ↗</a></li>`).join('')}</ul></section><section class="credit-panel"><h2>Research & media</h2><ul><li><a href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia — artist overviews and work pages ↗</a></li><li><a href="https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia" target="_blank" rel="noopener noreferrer">Wikimedia Commons — image files and license details ↗</a></li><li><a href="https://openlibrary.org/dev/docs/api/covers" target="_blank" rel="noopener noreferrer">Open Library — authentic book covers ↗</a></li><li><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube — source-hosted performances ↗</a></li><li><a href="https://unsplash.com/license" target="_blank" rel="noopener noreferrer">Unsplash License ↗</a></li></ul></section></div></div></section>`,'about-main')}
function missing(){return wrapMain(`<section class="section"><div class="shell"><div class="tiny eyebrow">An empty room</div><h1 class="artist-title">Exhibit not found.</h1><p class="muted">This doorway doesn't lead to a gallery. Return to the collection.</p><a class="button-primary" href="#/galleries">Browse galleries ↗</a></div></section>`,'missing-main')}

// Only reusable / public-domain Commons images are put in third-party page layouts.
const wikiCache=new Map();
async function wikiImage(article){
 const title=decoded(article).replaceAll('_',' ');
 if(wikiCache.has(title))return wikiCache.get(title);
 const task=(async()=>{
  try{
   const params=new URLSearchParams({action:'query',format:'json',prop:'pageimages',titles:title,pithumbsize:'850',pilicense:'free',redirects:'1',origin:'*'});
   const res=await fetch('https://en.wikipedia.org/w/api.php?'+params,{mode:'cors'});if(!res.ok)return null;
   const data=await res.json();const page=Object.values(data.query?.pages||{})[0];
   if(!page?.thumbnail?.source||!page.pageimage)return null;
   const licenseParams=new URLSearchParams({action:'query',format:'json',prop:'imageinfo',titles:`File:${page.pageimage}`,iiprop:'extmetadata|url',iiurlwidth:'850',origin:'*'});
   const lr=await fetch('https://commons.wikimedia.org/w/api.php?'+licenseParams,{mode:'cors'});if(!lr.ok)return null;
   const ld=await lr.json();const file=Object.values(ld.query?.pages||{})[0];
   const info=file?.imageinfo?.[0];const license=(info?.extmetadata?.LicenseShortName?.value||'').toLowerCase();
   if(!/^(?:public domain|pdm|cc0|cc\s*by(?:-sa)?)(?:\s|$)/.test(license))return null;
   if (!info.url || new URL(info.url).pathname.split('/')[2] !== 'commons') return null;
   return {src:info.thumburl || info.url,source:info.descriptionurl,license};
  }catch{return null}
 })();wikiCache.set(title,task);return task;
}
const bookCache=new Map();
async function bookCover(title,author){const key=title+'|'+author;if(bookCache.has(key))return bookCache.get(key);
 const task=(async()=>{try{
  const params=new URLSearchParams({title,author,limit:'10',fields:'key,title,author_name,cover_i'});
  const res=await fetch('https://openlibrary.org/search.json?'+params,{mode:'cors'});if(!res.ok)return null;
  const data=await res.json();const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');const matched=(data.docs||[]).find(d=>d.cover_i && (norm(d.title)===norm(title)||norm(d.title).startsWith(norm(title))));
  const doc=matched;return doc?{src:`https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`,source:`https://openlibrary.org${doc.key}`,license:'Book cover · publisher rights retained'}:null;
 }catch{return null}})();bookCache.set(key,task);return task;
}
async function hydrateImages(){
 const images=[...app.querySelectorAll('img[data-kind]')];
 await Promise.all(images.map(async image=>{
  const media=image.dataset.media;const result=media==='book' ?await bookCover(image.dataset.work,image.dataset.author):image.dataset.wiki ? await wikiImage(image.dataset.wiki) : null;
  if(!image.isConnected||!result?.src)return;
  image.onload=()=>{if(!image.isConnected)return;image.hidden=false;const placeholder=image.parentElement.querySelector('.portrait-placeholder, .work-fallback');if(placeholder)placeholder.hidden=true;const parent=image.closest('.work-art');if(parent){parent.classList.add('has-image');parent.dataset.source=result.source;parent.dataset.title=image.dataset.work;}const portraitLink=image.parentElement.querySelector('.portrait-label');if(portraitLink){portraitLink.hidden=false;portraitLink.href=result.source;portraitLink.textContent='Portrait · '+(result.license||'source')+' ↗';}}
  image.onerror=()=>{image.hidden=true;image.parentElement.querySelector('.work-fallback, .portrait-placeholder')?.removeAttribute('hidden')};
  image.src=result.src;image.dataset.imageSource=result.source;
 }));
}
function render(moveFocus = false){const route=currentHash();let html;
 if(route==='/'||route==='')html=home();
 else if(route==='/galleries')html=lobby();
 else if(route.startsWith('/gallery/'))html=galleryPage(route.slice('/gallery/'.length));
 else if(route.startsWith('/artist/'))html=artistPage(route.slice('/artist/'.length));
 else if(route==='/about')html=aboutPage();
 else html=missing();
 const lightbox = document.querySelector('#lightbox');
 if (lightbox.open) lightbox.close();
 app.innerHTML=html;
 if (moveFocus) app.querySelector('main').focus({preventScroll:true});
 document.title=route.startsWith('/artist/') ? `${getArtist(route.slice(8))?.name||'Artist'} · The Living Museum` : route.startsWith('/gallery/') ? `${getGallery(route.slice(9))?.name||'Gallery'} · The Living Museum`:'The Living Museum — An Exploration of Creative Minds';
 window.scrollTo({top:0,left:0,behavior:'instant'});
 hydrateImages();
}
window.addEventListener('hashchange',()=>{if(location.hash && !location.hash.startsWith('#/'))return;render(true)});
document.addEventListener('click',e=>{
 const zoom=e.target.closest('button[data-zoom]');if(zoom){const wrap=zoom.closest('.work-art');const img=wrap?.querySelector('img:not([hidden])');if(!img)return;const dialog=document.querySelector('#lightbox');document.querySelector('#lightbox-image').src=img.src;document.querySelector('#lightbox-image').alt=img.alt;document.querySelector('#lightbox-title').textContent=wrap.dataset.title||'Artwork';document.querySelector('#lightbox-source').href=img.dataset.imageSource||wrap.dataset.source||'#';dialog.showModal();}
});
document.querySelector('#lightbox-close').addEventListener('click',()=>document.querySelector('#lightbox').close());
document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
render();

</script>
